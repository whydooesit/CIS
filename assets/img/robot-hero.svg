<!--
  Simple, original robot SVG illustration for CIS Robotics website hero.
  Save as: assets/img/robot-hero.svg
  No external assets or fonts required.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Robot illustration">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#50E3C2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1724" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0f1724" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="eyeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background soft blob -->
  <g opacity="0.12">
    <ellipse cx="600" cy="360" rx="420" ry="230" fill="url(#g1)"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="600" cy="660" rx="340" ry="36" fill="#000" opacity="0.24" filter="url(#s)"/>

  <!-- Robot body -->
  <g transform="translate(300,160)">
    <!-- torso -->
    <rect x="160" y="120" rx="32" ry="32" width="380" height="420" fill="#0B1220" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <!-- chest panel -->
    <rect x="210" y="180" width="280" height="220" rx="20" fill="url(#g1)" opacity="0.12"/>
    <!-- center screen -->
    <rect x="300" y="240" width="160" height="100" rx="12" fill="#071026"/>
    <circle cx="360" cy="290" r="28" fill="#8CE7D9" />
    <circle cx="360" cy="290" r="12" fill="url(#eyeGlow)" opacity="0.85"/>
    <!-- small leds -->
    <g fill="#fff" opacity="0.18">
      <rect x="320" y="324" width="12" height="6" rx="2"/>
      <rect x="348" y="324" width="12" height="6" rx="2"/>
      <rect x="376" y="324" width="12" height="6" rx="2"/>
    </g>

    <!-- head -->
    <g>
      <rect x="240" y="24" width="320" height="140" rx="26" fill="#071024" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
      <!-- eyes -->
      <g>
        <rect x="300" y="70" width="48" height="48" rx="10" fill="#ffffff" opacity="0.95"/>
        <rect x="452" y="70" width="48" height="48" rx="10" fill="#ffffff" opacity="0.95"/>
        <circle cx="324" cy="94" r="14" fill="#4A90E2"/>
        <circle cx="476" cy="94" r="14" fill="#50E3C2"/>
        <circle cx="324" cy="92" r="6" fill="#fff" opacity="0.9"/>
        <circle cx="476" cy="92" r="6" fill="#fff" opacity="0.9"/>
      </g>

      <!-- mouth -->
      <rect x="360" y="120" width="80" height="14" rx="7" fill="#0b1220" opacity="0.9"/>

      <!-- antenna -->
      <g>
        <rect x="390" y="-18" width="20" height="44" rx="10" fill="#4A90E2"/>
        <circle cx="400" cy="-28" r="14" fill="#50E3C2"/>
      </g>
    </g>

    <!-- left arm -->
    <g transform="translate(120,220)">
      <rect x="0" y="0" width="80" height="28" rx="12" fill="#0B1220"/>
      <rect x="-20" y="28" width="44" height="120" rx="16" fill="#0B1220"/>
      <circle cx="2" cy="156" r="18" fill="#4A90E2"/>
    </g>

    <!-- right arm -->
    <g transform="translate(560,220)">
      <rect x="0" y="0" width="80" height="28" rx="12" fill="#0B1220"/>
      <rect x="56" y="28" width="44" height="120" rx="16" fill="#0B1220"/>
      <circle cx="100" cy="156" r="18" fill="#50E3C2"/>
    </g>

    <!-- wheels -->
    <g>
      <circle cx="260" cy="560" r="44" fill="#0b1220" stroke="#fff" opacity="0.04"/>
      <circle cx="620" cy="560" r="44" fill="#0b1220" stroke="#fff" opacity="0.04"/>
      <circle cx="260" cy="560" r="22" fill="#17202a"/>
      <circle cx="620" cy="560" r="22" fill="#17202a"/>
    </g>

    <!-- badges / decoration -->
    <g transform="translate(220,460)" fill="#fff" opacity="0.06">
      <rect x="10" y="0" width="120" height="28" rx="8"/>
      <rect x="150" y="0" width="80" height="28" rx="8"/>
    </g>
  </g>

  <!-- small decorative dots -->
  <g fill="#fff" opacity="0.06">
    <circle cx="60" cy="120" r="6"/>
    <circle cx="1100" cy="80" r="5"/>
    <circle cx="980" cy="520" r="4"/>
  </g>
</svg>
